<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>員工登入 - 崇愛居家長照機構</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .staff-login-wrapper {
      width: 100%; max-width: 420px; margin: 24px;
      padding: 44px 36px; background: #fff;
      border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.3);
      border-top: 5px solid #e07b54;
    }
    .staff-logo { text-align: center; margin-bottom: 32px; }
    .staff-logo .icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg,#e07b54,#c4623a);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 28px; color: #fff;
    }
    .staff-logo h2 { color: #2c3e50; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .staff-logo p { color: #888; font-size: 14px; }
    .login-error {
      background: #fdf2f2; border: 1px solid #f5c6cb; border-radius: 8px;
      color: #c44; padding: 12px 16px; margin-bottom: 16px; display: none; font-size: 14px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 500; color: #333; margin-bottom: 8px; font-size: 14px; }
    .form-control {
      width: 100%; padding: 12px 16px; font-size: 15px; border: 1.5px solid #ddd;
      border-radius: 8px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit; background: #fafafa;
    }
    .form-control:focus { border-color: #e07b54; box-shadow: 0 0 0 3px rgba(224,123,84,0.15); background: #fff; }
    .form-control::placeholder { color: #bbb; }
    .form-hint { font-size: 12px; color: #aaa; margin-top: 4px; }
    .btn-login {
      width: 100%; padding: 14px; margin-top: 8px;
      background: linear-gradient(135deg,#e07b54,#c4623a); color: #fff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: opacity 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { opacity: 0.88; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .password-hint {
      background: #f8f4ef; border: 1px solid #e0cfc0; border-radius: 8px;
      padding: 14px 16px; font-size: 13px; color: #666; margin-top: 20px;
      text-align: center; line-height: 1.6;
    }
    .back-link { display: block; text-align: center; margin-top: 20px; color: #aaa; font-size: 13px; text-decoration: none; }
    .back-link:hover { color: #888; }
  </style>
</head>
<body>

<div class="staff-login-wrapper">
  <div class="staff-logo">
    <div class="icon"><i class="fas fa-user-shield"></i></div>
    <h2>👥 員工專區</h2>
    <p>請輸入您的身份證字號與生日密碼</p>
  </div>

  <div class="login-error" id="login-error">身份證字號或生日錯誤，請重新輸入</div>

  <form id="login-form" autocomplete="off">
    <div class="form-group">
      <label for="id-card">身份證字號</label>
      <input type="text" class="form-control" id="id-card"
             placeholder="例：A123456789" maxlength="10"
             style="text-transform:uppercase" autocomplete="off">
      <div class="form-hint">請填寫大寫字母開頭的身份證字號</div>
    </div>
    <div class="form-group">
      <label for="birthday">生日（民國年 MMDD）</label>
      <input type="text" class="form-control" id="birthday"
             placeholder="例：0650515" maxlength="7" autocomplete="off">
      <div class="form-hint">以民國年+月日填寫，如：0650515</div>
    </div>
    <button type="submit" class="btn-login" id="login-btn">
      <i class="fas fa-sign-in-alt"></i>&nbsp; 登入員工專區
    </button>
  </form>

  <div class="password-hint">
    💡 密碼為您的「民國生日」（如 0650515）<br>
    如有疑問請洽主管
  </div>

  <a href="/" class="back-link">← 返回首頁</a>
</div>

<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbzsfCeZ6XbKUaLl_R0wwqM9snrXSBWrJIZpr8SKVPqhxw4xc1zvGMUt3ogrbKCWjmcC/exec";

(function() {
  if (localStorage.getItem("staff_ok") === "ok") {
    window.location.href = "dashboard.html";
    return;
  }

  var form   = document.getElementById("login-form");
  var errBox = document.getElementById("login-error");
  var btn    = document.getElementById("login-btn");

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    var idCard   = document.getElementById("id-card").value.trim().toUpperCase();
    var birthday = document.getElementById("birthday").value.trim();

    errBox.style.display = "none";

    if (!idCard || idCard.length < 10) {
      errBox.textContent = "請填寫正確的身份證字號（10碼）";
      errBox.style.display = "block";
      return;
    }
    // 生日：6-7位數字（民國年+月日）
    if (!/^\d{6,7}$/.test(birthday)) {
      errBox.textContent = "生日格式錯誤，請填入民國年+月日（如：0650515）";
      errBox.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 驗證中…';

    // Step 1: 用 GET 先驗證身份（可讀取回應）
    var checkUrl = GAS_URL + "?action=login_check&idCard=" + encodeURIComponent(idCard) + "&birthday=" + encodeURIComponent(birthday);

    fetch(checkUrl)
      .then(function(resp) { return resp.json(); })
      .then(function(data) {
        if (data.ok) {
          // 驗證成功，寫入 localStorage 並跳轉
          localStorage.setItem("staff_ok", "ok");
          localStorage.setItem("staff_idCard", data.idCard);
          localStorage.setItem("staff_name", data.name || "");
          // 短暫停頓確保寫入完成再跳轉
          setTimeout(function() {
            window.location.href = "dashboard.html";
          }, 50);
        } else {
          showError(data.error || "身份證字號或生日錯誤");
        }
      })
      .catch(function(err) {
        showError("網路連線異常，請稍後再試（" + err.message + "）");
      });
  });

  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = "block";
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i>&nbsp; 登入員工專區';
  }
})();
</script>
</body>
</html>
